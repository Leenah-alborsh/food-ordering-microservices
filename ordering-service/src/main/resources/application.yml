server:
  port: 9002

spring:
  application:
    name: ordering-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ordering_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

customer-service:
  base-url: http://localhost:9001
  graphql-url: http://localhost:9001/graphql

grpc:
  client:
    customer-service:
      address: static://localhost:9091
      negotiation-type: plaintext
