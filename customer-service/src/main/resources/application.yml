server:
  port: 9001

spring:
  application:
    name: customer-service
  graphql:
    graphiql:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/customer_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CUSTOMER_DB_USERNAME:root}
    password: ${CUSTOMER_DB_PASSWORD:}

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

grpc:
  server:
    port: 9091
