syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.foodapp.customerservice.grpc";
option java_outer_classname = "CustomerProto";

package customer;

service CustomerGrpcService {
  rpc GetCustomerById (CustomerByIdRequest) returns (CustomerReply);
}

message CustomerByIdRequest {
  int64 id = 1;
}

message CustomerReply {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string address = 4;
}
